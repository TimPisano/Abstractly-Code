<body>

    <main class="admin-gate">
        <div class="admin-gate-card">
            <div class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5"/>
                </svg>
                Abstractly
            </div>
            <h1>Admin Login</h1>
            <!-- Always shown, unconditionally, regardless of whether a valid
                 session already exists -- this page must never silently skip
                 or shortcut past the credentials form under any condition.
                 A session established by an earlier real login still works
                 fine for direct dashboard.html access (normal session
                 persistence, unaffected) -- this is specifically about the
                 login page itself never bypassing its own form. -->
            <div id="adminLoginFormSection">
                <p class="admin-gate-subtitle">Internal access only. Sign in to manage access requests and view the uploaded portfolio.</p>
                <form id="adminLoginForm">
                    <input type="email" id="adminEmail" class="text-input" placeholder="you@company.com" required autocomplete="username" aria-label="Email address">
                    <input type="password" id="adminPassword" class="text-input" placeholder="Password" required autocomplete="current-password" aria-label="Password">
                    <a class="admin-gate-forgot-link" href="forgot-password.html">Forgot password?</a>
                    <button type="submit" class="btn-primary" id="adminLoginSubmitBtn">Sign In</button>
                </form>
                <p class="admin-gate-message" id="adminLoginMessage"></p>
            </div>
        </div>
    </main><script src="../config.js"></script>
    <script src="login.js"></script>
</body>
