<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password — Abstractly</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="../fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../design-system.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <main class="admin-gate">
        <div class="admin-gate-card">
            <div class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5"/>
                </svg>
                Abstractly
            </div>
            <h1>Reset your password</h1>
            <p class="admin-gate-subtitle">Enter the email for your admin account and we&rsquo;ll send you a link to choose a new password. The link expires in 1 hour.</p>
            <form id="adminForgotForm">
                <input type="email" id="adminForgotEmail" class="text-input" placeholder="you@company.com" required autocomplete="username" aria-label="Email address">
                <button type="submit" class="btn-primary" id="adminForgotSubmitBtn">Send reset link</button>
            </form>
            <p class="admin-gate-message" id="adminForgotMessage"></p>
            <a class="admin-gate-link" href="index.html">&larr; Back to sign in</a>
        </div>
    </main><script src="../config.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
