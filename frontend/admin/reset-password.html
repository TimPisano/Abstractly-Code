<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password — Abstractly</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="../fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../design-system.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <main class="admin-gate">
        <div class="admin-gate-card">
            <div class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5"/>
                </svg>
                Abstractly
            </div>
            <h1>Choose a new password</h1>
            <p class="admin-gate-subtitle">Enter a new password for your admin account. Must be at least 8 characters.</p>
            <form id="adminResetForm">
                <input type="password" id="adminResetPassword" class="text-input" placeholder="New password" required autocomplete="new-password" minlength="8" aria-label="New password">
                <input type="password" id="adminResetPasswordConfirm" class="text-input" placeholder="Confirm new password" required autocomplete="new-password" minlength="8" aria-label="Confirm new password">
                <button type="submit" class="btn-primary" id="adminResetSubmitBtn">Set new password</button>
            </form>
            <p class="admin-gate-message" id="adminResetMessage"></p>
            <!-- Shown by reset-password.js only when the token is
                 missing/expired/already used -- a dead link is a dead
                 end without an obvious way to get a fresh one. -->
            <a class="admin-gate-link" id="adminResetRequestNewLink" href="forgot-password.html" hidden>Request a new reset link</a>
            <a class="admin-gate-link" href="index.html">&larr; Back to sign in</a>
        </div>
    </main><script src="../config.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
