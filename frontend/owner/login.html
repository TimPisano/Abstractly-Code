<body>

    <main class="owner-gate">
        <div class="owner-gate-card">
            <div class="owner-brand"><svg class="owner-brand-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5"/></svg><span>Abstractly</span></div>
            <h1>Owner Console</h1>
            <p class="owner-gate-subtitle">Not a team login. Sign in with the operator account.</p>
            <form id="ownerLoginForm">
                <input type="email" id="ownerEmail" class="text-input" placeholder="you@company.com" required autocomplete="username" aria-label="Email address">
                <input type="password" id="ownerPassword" class="text-input" placeholder="Password" required autocomplete="current-password" aria-label="Password">
                <button type="submit" class="btn-primary btn-block" id="ownerLoginSubmitBtn">Sign In</button>
            </form>
            <p class="owner-gate-message" id="ownerLoginMessage"></p>
        </div>
    </main><script src="../config.js"></script>
    <script src="login.js"></script>
</body>
