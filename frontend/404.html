<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Abstractly</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/design-system.css">
    <link rel="stylesheet" href="/app/styles.css">
    <style>
        /* This page is served at any unmatched path, so its links must be
           root-absolute, and it can't assume a sidebar/app shell exists.
           The card treatment is shared with the sign-in screens. */
        .notfound-code {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--lux-accent-text);
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .notfound-actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="access-gate">
        <div class="access-gate-card">
            <div class="brand">
                <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5" />
                </svg>
                <span>Abstractly</span>
            </div>

            <p class="notfound-code">404</p>
            <h1>Page not found</h1>
            <p class="access-gate-subtitle">The page you&rsquo;re looking for doesn&rsquo;t exist or may have moved.</p>

            <div class="notfound-actions">
                <a class="btn-primary" href="/" style="text-align:center; text-decoration:none;">Go to homepage</a>
                <a class="access-gate-link" href="/app/">Sign in to the app</a>
            </div>
        </div>
    </div>
</body>
</html>
