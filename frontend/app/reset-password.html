<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password — Abstractly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="access-gate" id="accessGate">
        <div class="access-gate-card">
            <div class="brand">
                <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5" />
                </svg>
                <span>Abstractly</span>
            </div>

            <h1>Choose a new password</h1>
            <p class="access-gate-subtitle">Enter a new password for your account. Must be at least 8 characters.</p>
            <form id="resetForm">
                <input type="password" id="resetPassword" class="text-input" placeholder="New password" required autocomplete="new-password" minlength="8">
                <input type="password" id="resetPasswordConfirm" class="text-input" placeholder="Confirm new password" required autocomplete="new-password" minlength="8">
                <button type="submit" class="btn-primary" id="resetSubmitBtn">Set new password</button>
            </form>
            <p class="access-gate-message" id="resetMessage"></p>
            <!-- Shown by reset-password.js only when the token is
                 missing/expired/already used -- a dead link is a dead
                 end without an obvious way to get a fresh one. -->
            <a class="access-gate-link" id="resetRequestNewLink" href="forgot-password.html" hidden>Request a new reset link</a>
            <a class="access-gate-link" href="login.html">&larr; Back to sign in</a>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
