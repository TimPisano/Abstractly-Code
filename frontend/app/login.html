<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign in — Abstractly</title>
    <meta name="description" content="Abstractly checks the leases behind a multifamily rent roll, unit by unit, before your deal closes.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0a0b">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <link rel="preload" href="../fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../design-system.css">
    <link rel="stylesheet" href="auth.css?v=1">
</head>
<body class="auth-page">
    <header class="auth-top">
        <a class="auth-brand" href="/"><svg class="auth-logo" viewBox="0 0 24 19" width="24" height="19" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="10" y="0" width="4" height="1" fill="currentColor"/><rect x="8" y="3" width="8" height="1" fill="currentColor"/><rect x="7" y="6" width="4" height="1" fill="currentColor"/><rect x="13" y="6" width="4" height="1" fill="currentColor"/><rect x="7" y="9" width="14" height="1" fill="currentColor"/><rect x="3" y="12" width="4" height="1" fill="currentColor"/><rect x="17" y="12" width="4" height="1" fill="currentColor"/><rect x="2" y="15" width="4" height="1" fill="currentColor"/><rect x="18" y="15" width="4" height="1" fill="currentColor"/><rect x="0" y="18" width="4" height="1" fill="currentColor"/><rect x="20" y="18" width="4" height="1" fill="currentColor"/></svg><span>Abstractly</span></a>
        <a class="auth-top-link" id="topGetStarted" href="signup.html" hidden>Get started</a>
    </header>

    <main class="auth-main">
        <section class="auth-card" data-view="form">
            <h1 class="auth-title">Sign in</h1>
            <p class="auth-lede">Welcome back.</p>
            <p class="auth-notice" id="loginNotice" role="status" hidden></p>
            <form class="auth-form" id="loginForm" novalidate>
                <div class="auth-field">
                    <label class="auth-label" for="email">Email</label>
                    <input class="auth-input" type="email" id="email" enterkeyhint="next" name="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required aria-describedby="emailError">
                    <p class="auth-field-error" id="emailError"></p>
                </div>
                <div class="auth-field">
                    <div class="auth-label-row">
                        <label class="auth-label" for="password">Password</label>
                        <a class="auth-label-link" href="forgot-password.html" id="forgotLink">Forgot password?</a>
                    </div>
                    <div class="auth-input-wrap">
                        <input class="auth-input" type="password" id="password" enterkeyhint="go" name="password" autocomplete="current-password" required aria-describedby="passwordError" autocapitalize="off" spellcheck="false">
                        <button class="auth-reveal" type="button" id="passwordToggle" aria-label="Show password" aria-pressed="false" aria-controls="password">Show</button>
                    </div>
                    <p class="auth-field-error" id="passwordError"></p>
                </div>
                <label class="auth-check">
                    <input type="checkbox" id="remember" name="remember" checked>
                    <span>Keep me signed in</span>
                </label>
                <button class="auth-button" type="submit" id="submitButton">Sign in</button>
                <p class="auth-status" id="formStatus" role="status" aria-live="polite"></p>
            </form>
            <p class="auth-alt" id="getStartedAlt" hidden>New to Abstractly? <a href="signup.html">Get started</a></p>
        </section>
    </main>

    <footer class="auth-footer">
        Questions? Email <a href="mailto:tim@getabstractly.com">tim@getabstractly.com</a>
    </footer>

    <script src="../config.js"></script>
    <script src="auth-common.js?v=1"></script>
    <script src="login.js?v=1"></script>
</body>
</html>
