<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Finish setting up — Abstractly</title>
    <meta name="description" content="Abstractly checks the leases behind a multifamily rent roll, unit by unit, before your deal closes.">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#0a0a0b">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <link rel="preload" href="../fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../design-system.css">
    <link rel="stylesheet" href="auth.css?v=1">
</head>
<body class="auth-page">
    <header class="auth-top">
        <a class="auth-brand" href="/"><svg class="auth-logo" viewBox="0 0 24 19" width="24" height="19" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="10" y="0" width="4" height="1" fill="currentColor"/><rect x="8" y="3" width="8" height="1" fill="currentColor"/><rect x="7" y="6" width="4" height="1" fill="currentColor"/><rect x="13" y="6" width="4" height="1" fill="currentColor"/><rect x="7" y="9" width="14" height="1" fill="currentColor"/><rect x="3" y="12" width="4" height="1" fill="currentColor"/><rect x="17" y="12" width="4" height="1" fill="currentColor"/><rect x="2" y="15" width="4" height="1" fill="currentColor"/><rect x="18" y="15" width="4" height="1" fill="currentColor"/><rect x="0" y="18" width="4" height="1" fill="currentColor"/><rect x="20" y="18" width="4" height="1" fill="currentColor"/></svg><span>Abstractly</span></a>
        <a class="auth-top-link" href="login.html">Sign in</a>
    </header>

    <main class="auth-main">
        <section class="auth-card" data-view="loading" aria-busy="true">
            <p class="auth-status"><span class="auth-spinner auth-spinner-inline" aria-hidden="true"></span> Checking your link...</p>
            <p class="auth-status" id="loadingSlow" role="status" aria-live="polite"></p>
        </section>

        <section class="auth-card" data-view="form" hidden>
            <p class="auth-eyebrow">Almost done</p>
            <h1 class="auth-title">Choose a password</h1>
            <p class="auth-lede" id="greeting">Choose a password to finish setting up your account.</p>
            <form class="auth-form" id="finishForm" novalidate>
                <input type="email" id="username" name="username" autocomplete="username" hidden readonly>
                <div class="auth-field">
                    <label class="auth-label" for="password">Password</label>
                    <div class="auth-input-wrap">
                        <input class="auth-input" type="password" id="password" name="password" autocomplete="new-password" required aria-describedby="passwordRules passwordError" autocapitalize="off" spellcheck="false" data-password>
                        <button class="auth-reveal" type="button" id="passwordToggle" aria-label="Show password" aria-pressed="false" aria-controls="password">Show</button>
                    </div>
                    <ul class="auth-rules" id="passwordRules" aria-label="Password requirements">
                        <li data-rule="length">At least 10 characters</li>
                        <li data-rule="common">Not a common password</li>
                        <li data-rule="personal">Not your email or name</li>
                    </ul>
                    <p class="auth-field-error" id="passwordError" role="alert"></p>
                </div>
                <label class="auth-check">
                    <input type="checkbox" id="remember" name="remember" checked>
                    <span>Keep me signed in</span>
                </label>
                <button class="auth-button" type="submit" id="submitButton">Create my account</button>
                <p class="auth-status" id="formStatus" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="auth-card" data-view="dead" hidden aria-live="polite">
            <div class="auth-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3 2"/></svg></div>
            <h1 class="auth-title" data-dead="title">This link doesn't work</h1>
            <p class="auth-lede" data-dead="body"></p>
            <div class="auth-actions" data-dead="actions"></div>
            <p class="auth-status" data-dead="status" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer class="auth-footer">
        Questions? Email <a href="mailto:tim@getabstractly.com">tim@getabstractly.com</a>
    </footer>

    <script src="../config.js"></script>
    <script src="auth-common.js?v=1"></script>
    <script src="finish-signup.js?v=1"></script>
</body>
</html>
