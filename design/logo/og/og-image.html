<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Abstractly social preview</title>
<!--
  Source for frontend/og-image.png (1200x630). Rendered headlessly by
  design/logo/render_assets.mjs (`node design/logo/render_assets.mjs og`
  renders just this). Open it in a browser at 1200x630 to edit.

  Deliberately minimal: the mark + wordmark and the fluted light bands,
  no other text -- the page's og:title supplies the headline under the
  image. Sized for a ~300px-wide iMessage/Slack thumbnail (a 1/4 scale):
  the wordmark is ~150px so it lands near 37px, and the mark's thin rules
  are ~9px so they stay visible at ~2px.
-->
<style>
@font-face {
  font-family: 'Inter';
  src: url('../../../frontend/fonts/inter-latin-var.woff2') format('woff2');
  font-weight: 100 900;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; background: #0a0a0b; overflow: hidden; }
body { position: relative; font-family: 'Inter', sans-serif; color: #ffffff; }

/* Fluted light bands, after the hero's WebGL shader: a warm gold glow
   across the full width, sliced into thin vertical ribs, brightest low
   in the frame and fading out toward the top and the edges. Kept dim:
   it's atmosphere, the logo is the subject. */
.bands {
  position: absolute; inset: -20px;
  background:
    radial-gradient(ellipse 60% 66% at 50% 80%, rgba(232, 196, 140, 0.72), rgba(182, 138, 78, 0.42) 38%, transparent 82%),
    radial-gradient(ellipse 120% 85% at 50% 92%, rgba(182, 138, 78, 0.34), rgba(182, 138, 78, 0.12) 60%, transparent 92%);
  -webkit-mask-image:
    repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0px, #000 7px, rgba(0,0,0,.92) 11px, rgba(0,0,0,.1) 18px, rgba(0,0,0,.04) 22px);
  mask-image:
    repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0px, #000 7px, rgba(0,0,0,.92) 11px, rgba(0,0,0,.1) 18px, rgba(0,0,0,.04) 22px);
  filter: blur(0.6px);
}
/* Darkens the band of the frame the lockup sits in, so white never lands
   on a bright rib, without hiding the bands above and below it. */
.wash {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 52% 30% at 50% 50%, rgba(10,10,11,0.82), rgba(10,10,11,0.5) 55%, rgba(10,10,11,0) 100%);
}

.lockup {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center; gap: 44px;
  padding-bottom: 6px;  /* optical centre: the wordmark's caps sit high */
}
.lockup img { height: 150px; width: auto; display: block; }
.lockup span { font-size: 150px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
</style>
</head>
<body>
<div class="bands"></div>
<div class="wash"></div>
<div class="lockup"><img src="../final/abstractly-mark-white.svg" alt=""><span>Abstractly</span></div>
</body>
</html>
