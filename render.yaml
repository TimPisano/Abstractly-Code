# Render "Blueprint" — deploys both services (backend API + frontend
# static site) from this one file in a single click, instead of
# clicking through two separate manual service-creation flows.
# See DEPLOYMENT.md for the full walkthrough (account creation,
# where to paste secret values, how to verify it worked).
#
# Service names below are what we asked Render for, but names are
# global across all Render users -- "abstractly" was already taken by
# someone else, so Render auto-suffixed ours:
#   backend:  https://abstractly-api.onrender.com   (name was available)
#   frontend: https://abstractly-n0id.onrender.com  (Render-assigned suffix)
# The backend's ADMIN_ALLOWED_ORIGINS below is set to match the
# frontend's REAL assigned URL, not the originally-requested one --
# CORS would silently block the live frontend otherwise. If either
# service is ever recreated and gets a different suffix, update
# ADMIN_ALLOWED_ORIGINS both here and directly in the Render
# dashboard's Environment tab for abstractly-api (don't assume a
# render.yaml edit alone takes effect on the live service immediately
# -- see DEPLOYMENT.md) to match.

services:
  # ---- Backend: Flask API, built from backend/Dockerfile ----
  - type: web
    name: abstractly-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    # Persistent disk for the SQLite database. Without it, every
    # redeploy (Render does one on each push to main) and every restart
    # starts from an empty database file on the container's own
    # ephemeral filesystem -- losing uploaded leases, rent rolls, Book
    # a Demo submissions, and any admin account created after the
    # ADMIN_EMAIL/ADMIN_PASSWORD_HASH seed.
    #
    # Render requires a PAID plan for disks (hence plan: starter above)
    # -- the free tier can't attach one at all.
    #
    # DB_PATH (below) is the only thing pointing database.py at this
    # disk instead of the ephemeral filesystem; app/api.py reads it at
    # import time and calls database.configure(), so NO code change is
    # needed. Verified at app/api.py:241-243.
    #
    # Two tradeoffs Render imposes on any disk-backed service: deploys
    # are no longer zero-downtime (the old instance stops before the
    # new one starts -- a few seconds), and the service can never scale
    # past a single instance. Neither is a new constraint here: SQLite
    # is a single-writer file database and couldn't be shared across
    # instances anyway.
    disk:
      name: abstractly-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # Real values are entered directly in the Render dashboard
      # (Environment tab), never committed here — see DEPLOYMENT.md.
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_ALLOWED_ORIGINS
        value: https://abstractly-n0id.onrender.com
      - key: LOCAL_DEV_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Must live under the disk's mountPath above, or the database is
      # back on the ephemeral filesystem and the disk does nothing.
      - key: DB_PATH
        value: /app/data/lease_portfolio.db
      # Upstash Redis connection string (rediss://...), from the
      # Upstash console -- backs the background lease-extraction queue
      # (app/jobs.py). Entered directly in the Render dashboard, never
      # committed here, same as the other secrets below.
      - key: REDIS_URL
        sync: false
      # Emails ADMIN_EMAIL on any ERROR/CRITICAL log line (rate-limited).
      # Needs EMAIL_USER/EMAIL_APP_PASSWORD/ADMIN_EMAIL set too. See
      # DEPLOYMENT.md "Getting alerted when something breaks".
      - key: ERROR_ALERT_EMAILS
        value: "true"
      # Optional -- the app degrades gracefully (clear error/skip,
      # never a crash) if any of these are left unset. Uncomment and
      # fill in via the dashboard only for the features you want live
      # on day one; see DEPLOYMENT.md for what each one unlocks.
      # - key: ANTHROPIC_API_KEY        # AI lease extraction + portfolio assistant
      #   sync: false
      # - key: LEASE_AI_EXTRACTION      # "true" -> uploads abstracted by the model
      #   value: "true"
      # - key: EMAIL_USER               # waitlist emails + error alerts
      #   sync: false
      # - key: EMAIL_APP_PASSWORD
      #   sync: false
      # - key: GOOGLE_APPLICATION_CREDENTIALS   # "Export to Google Sheets"
      #   value: /app/credentials/google-service-account.json

    # NOTE: uploaded FILES are deliberately never persisted, disk or
    # no disk. An upload is written to a temp file, parsed, and deleted
    # in a finally block (app/api.py:545 and its `os.unlink`); only the
    # extracted fields and page numbers are stored, in SQLite. So the
    # disk above covers everything durable this app has. Re-rendering a
    # page citation against its original PDF would need the source
    # document kept too -- a product change, not a hosting one.

  # ---- Frontend: static site, no build step ----
  - type: web
    name: abstractly
    runtime: static
    staticPublishPath: ./frontend
    envVars: []
    # Security response headers for the static site. The API sets its
    # own equivalents in app/security.py; these cover the HTML/JS/CSS
    # Render serves directly. The CSP was derived from a full audit of
    # the frontend (all scripts/styles/fonts are same-origin, no inline
    # <script>, no inline event handlers, no eval, no CDN); connect-src
    # must list the backend API origin for fetch() to work. If either
    # service is recreated with a new suffix, update the connect-src
    # host here to match (same as ADMIN_ALLOWED_ORIGINS above).
    #
    # Cache-Control (added in the QA pass): assets aren't content-hashed
    # (no build step), so CSS/JS get a short TTL — a deploy fix reaches
    # recent visitors within ~10 min instead of being stuck behind a
    # stale cache. HTML is never cached so a deploy shows immediately.
    # The font is a fixed 48 KB file that never changes
    # (frontend/fonts/README.md) — cache it hard. Render applies the
    # first matching rule per header name, so the specific /*.html and
    # /fonts/* Cache-Control rules must precede the /* fallback.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          connect-src 'self' https://abstractly-api.onrender.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data:;
          font-src 'self';
          object-src 'none';
          base-uri 'self';
          frame-ancestors 'none'
      - path: /*.html
        name: Cache-Control
        value: "no-cache"
      - path: /fonts/*
        name: Cache-Control
        value: "public, max-age=2592000"
      - path: /*
        name: Cache-Control
        value: "public, max-age=600, must-revalidate"

  # ---- Tester backend: same image as abstractly-api, own empty database ----
  # A genuinely separate deployment (own service, own container, own SQLite
  # file) for handing the real product to one outside tester at a time --
  # NOT the demo pair above (no DEMO_MODE, no seeded sample data, no
  # /demo/reset). Exists because this app has no per-account data isolation
  # within one deployment (see the demo backend's comment above and
  # docs/DEPLOYMENT.md's "Tester deployment" section) -- a tester account
  # added to abstractly-api itself would see every real customer's leases,
  # not a sandbox of their own.
  - type: web
    name: abstractly-tester-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # All four generated fresh for this deployment, never reused from
      # abstractly-api/abstractly-demo-api -- entered directly in the
      # Render dashboard, never committed here. See DEPLOYMENT.md.
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_ALLOWED_ORIGINS
        value: https://abstractly-tester.onrender.com
      - key: LOCAL_DEV_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Same Upstash instance abstractly-api/abstractly-demo-api already
      # use is fine -- paste the identical REDIS_URL value here. The
      # distinct queue name below is what actually keeps this
      # deployment's extraction jobs from ever landing in prod's or
      # demo's queue, not a separate Redis database.
      - key: REDIS_URL
        sync: false
      - key: LEASE_EXTRACTION_QUEUE
        value: extraction-tester
      # No persistent disk and still plan: free, deliberately -- only
      # abstractly-api gets a disk in this change. The tester's uploads
      # are therefore still wiped on restart and on the free tier's
      # ~15-min idle spindown. Fine for a short trial; to make a tester
      # run durable later, mirror the disk + DB_PATH block on
      # abstractly-api above (and note that a disk requires a paid
      # instance type, so it's a billing decision too).

  # ---- Tester frontend: same static files as abstractly, points at the tester backend ----
  - type: web
    name: abstractly-tester
    runtime: static
    staticPublishPath: ./frontend
    envVars: []
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          connect-src 'self' https://abstractly-tester-api.onrender.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data:;
          font-src 'self';
          object-src 'none';
          base-uri 'self';
          frame-ancestors 'none'
      - path: /*.html
        name: Cache-Control
        value: "no-cache"
      - path: /fonts/*
        name: Cache-Control
        value: "public, max-age=2592000"
      - path: /*
        name: Cache-Control
        value: "public, max-age=600, must-revalidate"

  # ---- Demo backend: same image as abstractly-api, own database ----
  # Seeded automatically on boot with 2 sample leases + a matching
  # sample rent roll (see app/demo_seed.py) and reset on demand via
  # POST /demo/reset or backend/reset_demo_data.py -- see
  # DEPLOYMENT.md's "Demo deployment" section. Deliberately its own
  # service/database rather than a user inside abstractly-api's
  # database: this app has no per-account data isolation, so a demo
  # login in the production database would see every real customer's
  # leases, not a walled-off sandbox.
  - type: web
    name: abstractly-demo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      # Long random value you generate yourself, entered in the Render
      # dashboard (Environment tab) -- never committed. Required in
      # the X-Demo-Reset-Token header of any POST /demo/reset call.
      - key: DEMO_RESET_TOKEN
        sync: false
      # Optional: set these too (can reuse your real admin's values or
      # pick dedicated demo-admin ones) to also get an owner/admin
      # login on this deployment -- see database._seed_first_admin_user.
      # Skip both to leave this deployment with only the seeded demo
      # account.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Update to the real assigned URL of abstractly-demo below if
      # Render auto-suffixes either name (see the top-of-file note for
      # why that can happen).
      - key: ADMIN_ALLOWED_ORIGINS
        value: https://abstractly-demo.onrender.com
      - key: LOCAL_DEV_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Same Upstash instance as abstractly-api is fine -- a distinct
      # queue name (below) keeps demo and prod extraction jobs from
      # ever landing in each other's queue. Can also point at a wholly
      # separate free Upstash database instead if you'd rather not
      # share one at all.
      - key: REDIS_URL
        sync: false
      - key: LEASE_EXTRACTION_QUEUE
        value: extraction-demo
      # Deliberately still plan: free with NO disk, unlike
      # abstractly-api above -- here losing
      # the database is a feature, not a caveat: a cold restart
      # after Render's free-tier idle spindown wipes the demo database,
      # and DEMO_MODE's startup seed immediately repopulates it, so a
      # demo instance that's been idle resets itself for free between
      # uses. The explicit POST /demo/reset / reset_demo_data.py path
      # exists for resetting on demand without waiting for that.

  # ---- Demo frontend: same static files as abstractly, points at the demo backend ----
  - type: web
    name: abstractly-demo
    runtime: static
    staticPublishPath: ./frontend
    envVars: []
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          connect-src 'self' https://abstractly-demo-api.onrender.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data:;
          font-src 'self';
          object-src 'none';
          base-uri 'self';
          frame-ancestors 'none'
      - path: /*.html
        name: Cache-Control
        value: "no-cache"
      - path: /fonts/*
        name: Cache-Control
        value: "public, max-age=2592000"
      - path: /*
        name: Cache-Control
        value: "public, max-age=600, must-revalidate"
